<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>법학 교과서 포털</title>
<meta name="theme-color" content="#1d4f73">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
<script src="./assets/pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 분야 바 → 세부과목 탭 → 과목별 15주차 목록. 법전의 편·장·절 체계를 따른 단정한 색인형 화면 */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#dde2ea;
  --accent:#1d4f73; --accent-soft:#e6eef5; --seal:#9b2c2c;
  --display:"Noto Serif KR","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2028; --fg:#e4e8ee; --muted:#9aa5b4; --line:#2c3440;
  --accent:#8fbbe0; --accent-soft:#1f2e3d; --seal:#e08a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2028; --fg:#e4e8ee; --muted:#9aa5b4; --line:#2c3440;
  --accent:#8fbbe0; --accent-soft:#1f2e3d; --seal:#e08a8a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:14px 0}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:10px;padding-bottom:14px}
.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--seal);color:var(--seal);font-style:normal;font-size:.8rem;border-radius:3px}
nav.cats{display:flex;gap:4px;margin-left:auto}
nav.cats button{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:6px 14px 16px;cursor:pointer;border-bottom:3px solid transparent}
nav.cats button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
nav.cats button:hover{color:var(--fg)}
.subs{background:var(--bg);border-bottom:1px solid var(--line)}
.subs .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.subs button{font:inherit;font-size:.9rem;white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:6px 14px;border-radius:999px;cursor:pointer}
.subs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:32px 64px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.2rem);margin:.2em 0 .3em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-size:1.25rem;margin:0 0 12px;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
/* home */
.cat-block{margin-top:36px}
.cat-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:6px;margin-bottom:14px}
.cat-head span{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card b{font-weight:600;font-size:1rem}
.card small{color:var(--muted);font-variant-numeric:tabular-nums}
/* course */
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 28px}
.chip{font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:4px;font-weight:500}
.weeks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.weeks li{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.wk{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);font-size:.9rem}
.wk-title{min-width:0;color:var(--muted)}
.wk-title.set{color:var(--fg)}
.status{font-size:.75rem;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:4px;white-space:nowrap}
.part{grid-column:1/-1;font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:18px 4px 6px !important;border-bottom:0 !important}
.back{font:inherit;font-size:.85rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
@media (max-width:560px){
  nav.cats{margin-left:0;width:100%}
  nav.cats button{flex:1;padding-bottom:12px}
  .weeks li{grid-template-columns:56px 1fr;}
  .status{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
<style>.open{display:inline-block;margin-bottom:24px;font-weight:600;color:var(--accent)}.wk-title a{color:var(--accent)}.wk-title a.sl{font-size:.78rem;margin-left:6px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted)}.weeks li.exam .wk-title{color:var(--seal)}</style>
</head>
<body>

<header>
  <div class="wrap top">
    <a class="brand" href="#home" id="brand"><i>法</i>교과서 포털</a>
    <nav class="cats" role="tablist" id="cats"></nav>
  </div>
  <div class="subs" id="subsBar" hidden><div class="wrap" role="tablist" id="subs"></div></div>
</header>
<main class="wrap" id="view"></main>

<script>
const CATS=[
  {id:"con",name:"헌법",courses:[
    {id:"con-intro",name:"헌법입문"},
    {id:"con-rights",name:"헌법과 기본권",reader:"법학 전공 2학년",pre:"헌법총론",page:"heonbeop-gibongwon.html"},
    {id:"con-cases",name:"헌법사례연습"},
    {id:"con-basic",name:"기초헌법"},
    {id:"con-election",name:"선거법과 민주적 선거관리",reader:"교양(비전공)",pre:"없음"}]},
  {id:"adm",name:"행정법",courses:[
    {id:"adm-intro",name:"행정법입문"},
    {id:"adm-remedy",name:"행정구제법"},
    {id:"adm-special",name:"행정법각론"},
    {id:"adm-cases",name:"행정법사례연습"},
    {id:"adm-fire",name:"소방법과 경찰행정법"}]},
  {id:"etc",name:"기타",courses:[
    {id:"etc-hs",name:"고교특강"},
    {id:"etc-inst",name:"기관특강"},
    {id:"etc-gen",name:"교양"}]}
];
const WEEKS=15;
// 주차 제목이 정해지면 여기에 넣는다. 예: TITLES["con-rights"]={1:"기본권의 개념과 기능"}
const TITLES={
  "con-election":{1:"오리엔테이션: 민주주의와 선거",2:"헌법과 민주주의의 원리",3:"대한민국 선거제도의 이해",4:"민주적 선거관리의 원리",5:"선거관리위원회와 선거절차",6:"특강① 공정한 선거관리는 어떻게 만들어지는가",7:"선거와 표현의 자유",8:"중간고사",9:"특강② 표현의 자유와 민주주의",10:"허위정보·가짜뉴스와 미디어 리터러시",11:"AI 시대의 선거와 민주주의",12:"특강③ 선거를 취재하는 기자는 무엇을 확인하는가",13:"민주적 시민과 선거문화",14:"특강④ 민주주의는 어떤 지도자를 선택하는가",15:"기말고사"},
  "con-rights":{1:"기본권 총론 — 개념과 연혁 · 기본권의 본질",2:"기본권의 주체와 효력",3:"기본권 제한과 심사방법 — 보호영역과 제한",4:"기본권의 한계와 심사방법 — 경합과 충돌",5:"인간의 존엄과 행복추구권 · 인격권",6:"평등권",7:"신체의 자유와 절차적 기본권",8:"중간고사",9:"표현의 자유 Ⅰ",10:"표현의 자유 Ⅱ",11:"양심·종교 등 정신적 자유",12:"직업의 자유",13:"재산권",14:"사회적 기본권",15:"기본권 종합사례"}
};
// 교재가 올라간 주차: 링크
const LINKS={"con-election":{10:"election/10-disinformation.html"},"con-rights":{1:"ch/01-1-concept.html",2:"ch/02-1-subject.html",3:"ch/03-1-limit.html",4:"ch/04-1-conflict.html",5:"ch/05-1-dignity.html",6:"ch/06-1-equality.html"}};

const $=s=>document.querySelector(s);
const findCourse=id=>{for(const c of CATS){const k=c.courses.find(x=>x.id===id);if(k)return{cat:c,course:k}}return null};
let state={cat:null,course:null};

function renderNav(){
  $("#cats").innerHTML=CATS.map(c=>`<button role="tab" aria-selected="${state.cat===c.id}" data-cat="${c.id}">${c.name}</button>`).join("");
  const cat=CATS.find(c=>c.id===state.cat);
  $("#subsBar").hidden=!cat;
  if(cat)$("#subs").innerHTML=cat.courses.map(k=>`<button role="tab" aria-selected="${state.course===k.id}" data-course="${k.id}">${k.name}</button>`).join("");
}
function home(){
  $("#view").innerHTML=`<p class="eyebrow">교재 목록</p><h1>분야별 교재</h1>
  <p class="lede">분야를 고른 뒤 세부과목을 선택하면 15주차 구성을 볼 수 있습니다.</p>`+
  CATS.map(c=>`<section class="cat-block"><div class="cat-head"><h2>${c.name}</h2><span>${c.courses.length}과목</span></div>
  <div class="grid">${c.courses.map(k=>`<button class="card" data-course="${k.id}"><b>${k.name}</b><small>${WEEKS}주차${k.page?" · 교재 있음":""}</small></button>`).join("")}</div></section>`).join("");
}
function catView(cat){
  $("#view").innerHTML=`<p class="eyebrow">${cat.name}</p><h1>${cat.name} 교재</h1>
  <p class="lede">세부과목을 선택하세요.</p><div class="grid" style="margin-top:24px">${cat.courses.map(k=>`<button class="card" data-course="${k.id}"><b>${k.name}</b><small>${WEEKS}주차</small></button>`).join("")}</div>`;
}
function courseView(cat,k){
  const t=TITLES[k.id]||{};
  let rows="";
  for(let w=1;w<=WEEKS;w++){
    const title=t[w], link=(LINKS[k.id]||{})[w], exam=/고사$/.test(title||"");
    const label=link?`<a href="${link}">${title}</a>${link.startsWith("ch/")?` <a class="sl" href="${link.replace("ch/","slides/")}">슬라이드</a>`:""}`:(title||"주제 미정");
    const st=exam?"시험":link?"교재 있음":title?"준비 중":"주제 미정";
    rows+=`<li${exam?' class="exam"':''}><span class="wk">${w}주차</span><span class="wk-title${title?" set":""}">${label}</span><span class="status">${st}</span></li>`;
  }
  const meta=[`${WEEKS}주차`];
  if(k.reader)meta.push(`독자: ${k.reader}`);
  if(k.pre)meta.push(`전제 지식: ${k.pre}`);
  $("#view").innerHTML=`<button class="back" data-cat="${cat.id}">← ${cat.name}</button>
  <p class="eyebrow" style="margin-top:14px">${cat.name}</p><h1>${k.name}</h1>
  <div class="meta">${meta.map(m=>`<span class="chip">${m}</span>`).join("")}</div>
  ${k.page?`<a class="open" href="${k.page}">교재 목차 열기 →</a>`:""}<ol class="weeks">${rows}</ol>`;
}
function go(cat,course){
  state={cat,course};
  renderNav();
  if(course){const f=findCourse(course);courseView(f.cat,f.course)}
  else if(cat)catView(CATS.find(c=>c.id===cat));
  else home();
  try{history.replaceState(null,"","#"+(course||cat||"home"))}catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-cat],[data-course]");
  if(b){
    if(b.dataset.course){const f=findCourse(b.dataset.course);go(f.cat.id,f.course.id)}
    else go(b.dataset.cat,null);
    return;
  }
  if(e.target.closest("#brand")){e.preventDefault();go(null,null)}
});
(function init(){
  const h=(location.hash||"").slice(1);
  const f=findCourse(h);
  if(f)go(f.cat.id,f.course.id);
  else if(CATS.some(c=>c.id===h))go(h,null);
  else go(null,null);
})();
</script>

</body>
</html>
